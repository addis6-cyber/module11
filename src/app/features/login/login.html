<div class="login-container">

  <div class="login-card">


<div class="brand">
  <div class="brand-icon">🎓</div>

  <div>
    <h1>TMS</h1>
    <p>Training Management System</p>
  </div>
</div>

<div class="welcome">
  <h2>Welcome Back</h2>
  <p>Sign in to continue to your account</p>
</div>

<form (ngSubmit)="login()">

  <div class="form-group">
    <label for="email">Email Address</label>

    <div class="input-wrapper">
      <span class="input-icon">✉</span>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />
    </div>
  </div>

  <div class="form-group">
    <label for="password">Password</label>

    <div class="input-wrapper">
      <span class="input-icon">🔒</span>

      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      />
    </div>
  </div>

  @if (error) {
    <div class="error-message">
      <span>⚠</span>
      {{ error }}
    </div>
  }

  <button
    type="submit"
    class="login-button"
    [disabled]="isLoading">

    @if (isLoading) {
      <span>Signing in...</span>
    } @else {
      <span>Sign In</span>
      <span class="arrow">→</span>
    }

  </button>

</form>

<div class="divider">
  <span>OR</span>
</div>

<div class="register-section">

  <p>Don't have an account?</p>

  <button
    type="button"
    class="register-button"
    (click)="goToRegister()">

    Create an Account

  </button>

</div>

<div class="footer">
  <p>© 2026 Training Management System</p>
</div>


  </div>

</div>
